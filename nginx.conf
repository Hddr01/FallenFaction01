server {
    listen 80;
    server_name localhost;
    client_max_body_size 100m;   # generous limit for chapter image uploads

    # Serve Vue SPA (all non-API routes go to index.html for vue-router)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api calls to the backend container
    location /api/ {
        proxy_pass         http://backend:7217;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_read_timeout 300s;
    }

    # Proxy /auth (Identity, Google/Facebook OAuth callbacks)
    location /auth/ {
        proxy_pass         http://backend:7217;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }

    # Serve uploaded files (covers, avatars) directly from the shared volume
    location /uploads/ {
        alias /app/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # WebSocket / SignalR (if added later)
    location /hubs/ {
        proxy_pass         http://backend:7217;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }
}