services:

  # ── Microsoft SQL Server ─────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: always
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"          # free tier — max 10 GB, fine for starting out
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${SA_PASSWORD} -Q 'SELECT 1' -No -C || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s             # SQL Server is slow to start — give it time

  # ── ASP.NET Core backend ─────────────────────────────────────────────────────
  backend:
    image: ${REGISTRY}/backend:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      sqlserver:
        condition: service_healthy  # wait for SQL Server to be ready before starting
    environment:
      ConnectionStrings__DefaultConnection: >
        Server=sqlserver,1433;Database=FallenFactionDB;
        User Id=sa;Password=${SA_PASSWORD};
        TrustServerCertificate=True;
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:7217
      HTTP_PORTS: ""                # silences "Overriding HTTP_PORTS" warning in Sentry
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: "FallenFaction"
      JwtSettings__Audience: "FallenFactionUsers"
      JwtSettings__ExpirationInHours: "24"
      StaticAssets__BaseUrl: ""
      Sentry__Dsn: ${SENTRY_DSN}
      Patreon__ClientId: ${PATREON_CLIENT_ID}
      Patreon__ClientSecret: ${PATREON_CLIENT_SECRET}
      Patreon__WebhookSecret: ${PATREON_WEBHOOK_SECRET}
      Patreon__RedirectUri: ${PATREON_REDIRECT_URI}
      FrontendBaseUrl: "https://fallenfaction.com"
      Resend__ApiKey: ${RESEND_API_KEY}
      Resend__FromEmail: "noreply@fallenfaction.com"
      Resend__AdminEmail: "contact@fallenfaction.com"
      Resend__DmcaEmail: "dmca@fallenfaction.com"
      # X.509 certificate (base64-encoded .pfx, private key, no password) that
      # encrypts the persisted Data Protection key ring at rest.
      # Required in Production — backend fails fast on startup if unset.
      # Generate once and store in the VPS .env:
      #   openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
      #     -keyout dp.key -out dp.crt -subj '/CN=FallenFaction'
      #   openssl pkcs12 -export -out dp.pfx -inkey dp.key -in dp.crt -passout pass:
      #   base64 -w0 dp.pfx
      DATA_PROTECTION_KEY: ${DATA_PROTECTION_KEY}
      # Uncomment when you add OAuth:
      # Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID}
      # Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
      # Authentication__Facebook__AppId: ${FACEBOOK_APP_ID}
      # Authentication__Facebook__AppSecret: ${FACEBOOK_APP_SECRET}
    volumes:
      - uploads_data:/app/wwwroot/uploads
      - dataprotection_keys:/app/dataprotection-keys  # persists ASP.NET Data Protection keys across restarts
    ports:
      - "127.0.0.1:7217:7217"

  # ── Vue.js frontend (nginx) ──────────────────────────────────────────────────
  frontend:
    image: ${REGISTRY}/frontend:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      - backend
    expose:
      - "80"
    volumes:
      - uploads_data:/app/uploads:ro

volumes:
  sqlserver_data:                   # persistent DB storage — survives container restarts
  uploads_data:                     # covers, avatars, chapter images
  dataprotection_keys:              # ASP.NET Data Protection key ring
